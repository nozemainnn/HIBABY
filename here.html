
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surprise!</title>
  <style>
    :root{
      --bg-start:#071127;
      --bg-end:#0b2545;
      --card-bg: rgba(255,255,255,0.04);
      --accent: #ff6b6b;
      --gap: 12px;
    }
    html,body{height:100%;margin:0}
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      background:linear-gradient(180deg,var(--bg-start),var(--bg-end));
      padding:16px;
      box-sizing:border-box;
      font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      -webkit-font-smoothing:antialiased;
    }
    .card{
      background:var(--card-bg);
      padding:18px;
      border-radius:14px;
      box-shadow:0 8px 24px rgba(0,0,0,0.45);
      text-align:center;
      max-width:460px;
      width:100%;
      box-sizing:border-box;
    }
    .images{
      display:flex;
      flex-direction:column;
      gap:var(--gap);
      align-items:center;
      margin-bottom:12px;
    }
    .images img{
      width:100%;
      max-width:380px;
      height:auto;
      max-height:50vh;
      border-radius:10px;
      object-fit:cover;
      display:block;
    }
    .back{
      display:inline-block;
      margin-top:6px;
      color:#fff;
      background:var(--accent);
      padding:10px 14px;
      border-radius:8px;
      text-decoration:none;
      font-weight:600;
    }
    .note{
      margin-top:8px;
      color:rgba(255,255,255,0.7);
      font-size:13px;
    }

    @media (max-width:420px){
      body{padding:12px}
      .card{padding:12px}
      .images img{max-height:42vh}
      .back{padding:8px 12px}
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-label="Surprise card">
    <div class="images" aria-hidden="false">
      <img src="cat.png" alt="Cat surprise" onerror="this.style.display='none'">
      <img src="bf.jpg" alt="Friend surprise" onerror="this.style.display='none'">
      <img src="love.png" alt="Love icon" onerror="this.style.display='none'">
    </div>

    <a class="back" href="index.html" aria-label="Back to home">pst!</a>
 
  </main>
</body>
</html>
