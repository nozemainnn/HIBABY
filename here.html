<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surprise!</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Responsive card centered on screen */
    :root{
      --bg-start:#071127;
      --bg-end:#0b2545;
      --card-bg: rgba(255,255,255,0.04);
      --accent: #ff6b6b;
    }
    html,body{height:100%;margin:0}
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      background:linear-gradient(180deg,var(--bg-start),var(--bg-end));
      padding:16px;
      box-sizing:border-box;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .card{
      background:var(--card-bg);
      padding:18px;
      border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
      text-align:center;
      max-width:420px;
      width:100%;
      box-sizing:border-box;
    }

    .card .images{
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
    }

    .card img{
      width:100%;
      max-width:360px;
      height:auto;
      max-height:45vh;
      border-radius:10px;
      object-fit:contain;
      display:block;
    }

    .back{
      margin-top:12px;
      display:inline-block;
      color:#fff;
      background:var(--accent);
      padding:8px 12px;
      border-radius:8px;
      text-decoration:none;
    }

    @media (max-width:420px){
      .card{padding:12px}
      .card img{max-height:40vh}
    }
  </style>
</head>
<body>
  <div class="card" role="main" aria-label="Surprise card">
    <div class="images">
      <img src="cat.png" alt="Cat surprise" />
      <img src="bf.jpg" alt="Friend surprise" />
      <img src="love.png" alt="Love icon" />
    </div>

    <a class="back" href="index.html">pst!</a>
  </div>
</body>
</html>
