
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surprise!</title>
  <style>
    :root{
      --bg-start:#071127;
      --bg-end:#0b2545;
      --card-bg: rgba(255,255,255,0.04);
      --accent: #ff6b6b;
      --gap: 12px;
    }

    /* Base layout */
    html,body{height:100%;margin:0}
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      background:linear-gradient(180deg,var(--bg-start),var(--bg-end));
      padding:16px;
      box-sizing:border-box;
      font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      -webkit-font-smoothing:antialiased;
    }

    /* Card container */
    .card{
      background:var(--card-bg);
      padding:18px;
      border-radius:14px;
      box-shadow:0 8px 24px rgba(0,0,0,0.45);
      text-align:center;
      max-width:460px;
  width:100%;
  /* Prevent the card from growing taller than the viewport so images won't cover whole screen */
  max-height: calc(100vh - 80px);
  overflow-y: auto;
      box-sizing:border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Images stack and sizing — keep them full-width but capped for visual balance */
    .images{
      display:flex;
      flex-direction:column;
      gap:var(--gap);
      align-items:center;
      margin-bottom:12px;
      width:100%;
    }

    /* Use contain so important parts are visible on narrow crops; add subtle border/shadow */
    .images img{
      width:100%;
      max-width:380px;
      height:auto;
      max-height:45vh;
      border-radius:10px;
      object-fit:contain;
      display:block;
      box-shadow:0 6px 18px rgba(0,0,0,0.35);
      border:1px solid rgba(255,255,255,0.03);
    }

    /* Back button styling — larger tap target on mobile */
    .back{
      display:inline-block;
      margin-top:10px;
      color:#fff;
      background:var(--accent);
      padding:12px 16px;
      border-radius:10px;
      text-decoration:none;
      font-weight:600;
      box-shadow:0 6px 14px rgba(0,0,0,0.35);
    }

    .note{
      margin-top:8px;
      color:rgba(255,255,255,0.7);
      font-size:13px;
    }

    /* Mobile-first adjustments */
    @media (max-width:520px){
      body{padding:12px}
      .card{padding:12px; border-radius:12px}
      /* Reduce image height on small screens so it doesn't fill the entire viewport */
      .images img{max-height:32vh; max-width:100%;}
      .back{padding:10px 14px}
    }

    /* Very small phones — tighten spacing and ensure images don't overflow */
    @media (max-width:380px){
      :root{--gap:10px}
      /* Even smaller maximum height for very small phones */
      .images img{max-height:28vh}
      .card{padding:10px}
      .back{padding:10px 12px}
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-label="Surprise card">
    <div class="images" aria-hidden="false">
      <img src="cat.png" alt="Cat surprise" onerror="this.style.display='none'">
      <img src="bf.png" alt="Friend surprise" onerror="this.style.display='none'">
      <img src="love.png" alt="Love icon" onerror="this.style.display='none'">
    </div>

    <a class="back" href="index.html" aria-label="Back to home">pst! haha</a>
 
  </main>
</body>
</html>
